[project]
name = "pyproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jaeho1900", email = "glad1900@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "ipykernel>=7.4.0",
    "kaleido>=1.5.2",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.2",
    "langchain-huggingface>=1.3.0",
    "langchain-ollama>=1.2.0",
    "langchain-text-splitters>=1.2.0",
    "langgraph>=1.2.24",
    "nbformat>=5.11.1",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pypdf>=7.1.1",
    "python-calamine>=0.9.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
pyproject = "pyproject:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
